name: bedside_clock
description: "Orologio da comodino con radio internet, temi giorno/notte e protezione anti burn-in"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.0
  audio_session: ^0.1.0
  shared_preferences: ^2.0.0
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# path_provider_android >= 2.3.0 ships a JNI-based Android implementation
# (via the `jni` package) whose android/build.gradle is incompatible with
# the AGP 9 / Kotlin 2.3 combo that current Flutter stable scaffolds.
# 2.2.1 is too old instead: it still references the removed v1 plugin
# embedding API (PluginRegistry.Registrar) and fails to compile against
# the current Flutter engine. 2.2.23 is the last pre-JNI release built
# against the v2 embedding, so it works with both ends.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
