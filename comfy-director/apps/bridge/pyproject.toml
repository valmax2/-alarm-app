[project]
name = "comfy-director-bridge"
version = "0.1.0"
description = "Comfy Director Bridge — backend locale che collega Comfy Director a ComfyUI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "websockets>=12.0,<13.0",
    "python-multipart>=0.0.9,<1.0",
    "cryptography>=42.0,<44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "respx>=0.21,<1.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI usa deliberatamente Depends(...) come default degli argomenti — è
# l'idioma standard del framework, non un bug.
extend-select = ["B", "I"]
ignore = ["B008"]
