name: Build VoiceCloneStudio APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VoiceCloneStudio/**'
      - '.github/workflows/build_voiceclonestudio_apk.yml'
  workflow_dispatch: # Permette di avviare la build manualmente da GitHub

permissions:
  contents: write # Serve per pubblicare l'APK in docs/downloads/ (vedi ultimo step)

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VoiceCloneStudio

    steps:
      # 1. Scarica il codice sorgente
      - uses: actions/checkout@v4

      # 2. Configura Java 17 (richiesto da AGP 8.7.3 / compileSdk 35)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Configura Android SDK e accetta le licenze
      - uses: android-actions/setup-android@v3

      # 4. Rende eseguibile il wrapper Gradle
      - run: chmod +x gradlew

      # 5. Legge versionName/versionCode da build.gradle.kts, per nominare l'APK di conseguenza
      - name: Leggi la versione dell'app
        id: version
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "filename=VoiceCloneStudio-v${NAME}-${CODE}-debug" >> "$GITHUB_OUTPUT"

      # 6. Compila l'APK in modalità debug
      - run: ./gradlew assembleDebug --stacktrace

      # 7. Esegue i test unitari
      - run: ./gradlew testDebugUnitTest --stacktrace

      # 8. Rinomina l'APK includendo la versione, cosi il file scaricato la porta già nel nome
      - name: Rinomina l'APK con la versione
        run: |
          mkdir -p app/build/outputs/apk/debug/renamed
          cp app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/renamed/${{ steps.version.outputs.filename }}.apk"

      # 9. Carica l'APK tra gli allegati scaricabili della build (richiede login GitHub per scaricarlo)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.filename }}
          path: VoiceCloneStudio/app/build/outputs/apk/debug/renamed/${{ steps.version.outputs.filename }}.apk

      # 10. Pubblica l'APK anche in docs/downloads/ del repo (pubblico): un link fisso,
      #     scaricabile da chiunque senza bisogno di login GitHub — a differenza dell'artifact
      #     sopra, che richiede l'accesso autenticato alla UI di Actions.
      - name: Pubblica l'APK per il download diretto
        run: |
          mkdir -p ../docs/downloads
          cp "app/build/outputs/apk/debug/renamed/${{ steps.version.outputs.filename }}.apk" \
             ../docs/downloads/VoiceCloneStudio-latest.apk
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/VoiceCloneStudio-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest VoiceCloneStudio debug APK (${{ steps.version.outputs.filename }})"
            git push
          else
            echo "APK invariato, niente da pubblicare."
          fi
